<!DOCTYPE html>
<html>
<head>

<title>AP TET MOCK TEST 2026</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#e8f1ff;
}

.container{

width:500px;
margin:80px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px gray;

}

h1{

text-align:center;
color:#003366;

}

input,select{

width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border-radius:5px;
border:1px solid gray;
font-size:16px;

}

button{

width:100%;
padding:15px;
background:#003366;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#0055aa;

}

.footer{

text-align:center;
margin-top:15px;
font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<h1>AP TET MOCK TEST</h1>

<label>Candidate Name</label>

<input type="text"
id="name"
placeholder="Enter your name">


<label>Hall Ticket Number</label>

<input type="text"
id="hallticket"
placeholder="Optional">


<label>Select Paper</label>

<select id="paper">

<option>Paper - 2A</option>

</select>


<button onclick="startExam()">

Proceed

</button>

<div class="footer">

AP TET CBT Practice Examination

</div>

</div>

<script>

function startExam(){

let name=document.getElementById("name").value;

if(name==""){

alert("Please Enter Your Name");

return;

}

localStorage.setItem("name",name);

window.location.href="instructions.html";

}

</script>

</body>
</html>s
