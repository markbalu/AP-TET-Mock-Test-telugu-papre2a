<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Select Subject</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f8ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px gray;
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:30px;
}

.subjectBtn{
    width:100%;
    padding:18px;
    margin-bottom:15px;
    background:#003366;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.subjectBtn:hover{
    background:#0055aa;
}

</style>
</head>

<body>

<div class="container">

<h1>Select Subject</h1>

<button class="subjectBtn"
onclick="selectSubject('Telugu Paper-2A')">
Telugu Paper-2A
</button>

<button class="subjectBtn"
onclick="selectSubject('Telugu Literature Paper-2A')">
Telugu Literature Paper-2A
</button>

<button class="subjectBtn"
onclick="selectSubject('Telugu Methodology Paper-2A')">
Telugu Methodology Paper-2A
</button>

<button class="subjectBtn"
onclick="selectSubject('English Paper-2A')">
English Paper-2A
</button>

<button class="subjectBtn"
onclick="selectSubject('Child Development and Pedagogy')">
Child Development and Pedagogy
</button>

</div>


<script>

function selectSubject(subject){

    // Save selected subject
    localStorage.setItem("selectedSubject",subject);

    // Open Exam Page
    window.location.href="exam.html";

}

</script>

</body>
</html>
